name: Publish GitHub Release Notes to website repo

on:
  release:
    # released: the one-shot sync when a release goes live. build_and_test.yml
    # publishes each tag as a prerelease with GITHUB_TOKEN, which triggers no
    # workflows; this fires when a person then changes it to a full release, so
    # the notes must be in place by that save. Deliberately NOT 'edited': every
    # later edit would open another website PR. Post-publish notes corrections
    # are covered by the workflow_dispatch path below.
    types: [released]
  workflow_dispatch:
    inputs:
      project_id:
        description: 'Project ID'
        required: true
        default: 'reaspeech-lite'
      project_name:
        description: 'Project name'
        required: true
        default: 'ReaSpeech Lite'
      project_repository:
        description: 'GitHub repository where the project is hosted'
        required: true
        default: 'TeamAudio/reaspeech-lite'
      # No defaults: a placeholder here would end up in a website PR.
      version_tag:
        description: 'Version tag (vX.Y.Z)'
        required: true
      release_body:
        description: 'Release body content'
        required: true

# All pushes/PRs happen in other repos via the service token; this workflow
# needs nothing from its own repo token.
permissions:
  contents: read

jobs:
  publish-release-notes:
    # GitHub already filters draft releases out of created/edited triggers; the
    # draft check is defense-in-depth. Prereleases are skipped deliberately.
    if: ${{ github.event_name == 'workflow_dispatch' || (!github.event.release.draft && !github.event.release.prerelease) }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          repository: TeamAudio/techaudio-web
          # Pinned to main: a selectable ref would let any dispatcher run
          # arbitrary action code with the service token.
          ref: main
          fetch-depth: 0  # Fetch all history for accurate versioning
          token: ${{ secrets.PUBLISH_RELEASE_SERVICE_TOKEN}}
          # This checkout only resolves the action; it never pushes.
          persist-credentials: false
          path: techaudio-web

      - name: Call publish-release action
        uses: ./techaudio-web/.github/actions/publish-release
        with:
          project_id: ${{ github.event.inputs.project_id || 'reaspeech-lite' }}
          project_name: ${{ github.event.inputs.project_name || 'ReaSpeech Lite' }}
          project_repository: ${{ github.event.inputs.project_repository || github.repository }}
          version_tag: ${{ github.event.inputs.version_tag || github.event.release.tag_name }}
          release_body: ${{ github.event.inputs.release_body || github.event.release.body }}
          service_token: ${{ secrets.PUBLISH_RELEASE_SERVICE_TOKEN }}

